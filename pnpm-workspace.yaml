packages:
  - packages/*
  - scripts
  - apps/*
  - apps/*/api
  - apps/*/web

# One version of each shared dependency across the monorepo.
# Dependencies allowed to run install scripts (pnpm blocks all others).
allowBuilds:
  esbuild: true
  workerd: true

catalog:
  '@aws-sdk/client-dynamodb': 3.1150.0
  '@aws-sdk/client-eventbridge': 3.1150.0
  '@aws-sdk/client-ssm': 3.1150.0
  '@aws-sdk/lib-dynamodb': 3.1150.0
  '@biomejs/biome': 2.5.15
  '@cloudflare/vite-plugin': 1.64.0
  '@cloudflare/workers-types': 5.20261014.1
  '@hono/node-server': 2.1.5
  '@hono/zod-validator': 0.9.1
  '@playwright/test': 1.64.1
  '@testing-library/dom': 10.4.2
  '@testing-library/react': 16.3.3
  '@types/aws-lambda': 8.10.164
  '@types/node': 24.19.2
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  '@vitejs/plugin-react': 6.1.2
  esbuild: 0.28.2
  hono: 4.13.13
  jsdom: 30.1.2
  react: 19.3.0
  react-dom: 19.3.0
  tsx: 4.23.15
  turbo: 2.11.8
  typescript: 7.0.2
  vite: 8.3.4
  vitest: 5.0.4
  wrangler: 4.151.0
  zod: 4.6.7

minimumReleaseAgeExclude:
  - '@cloudflare/vite-plugin@1.64.0'
  - '@cloudflare/workers-types@5.20261014.1'
  - miniflare@5.20261012.0-beta
  - wrangler@4.151.0
